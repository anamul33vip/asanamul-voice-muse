services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: anam_voice
      POSTGRES_USER: anam
      POSTGRES_PASSWORD: local_dev_only_change_me
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data", "./backend/db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro"]
  api:
    build: ./backend
    env_file: ./backend/.env
    ports: ["8080:8080"]
    depends_on: [db]
volumes:
  pgdata:
